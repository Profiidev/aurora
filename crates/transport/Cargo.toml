[package]
name = "aurora_transport"
description = "Transport trait and iroh, bluer and nusb backends for Aurora"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
iroh = ["dep:iroh", "dep:iroh-mdns-address-lookup", "dep:n0-future"]
bluer = ["dep:bluer"]
nusb = ["dep:nusb"]

[dependencies]
tracing.workspace = true
aurora_proto.workspace = true
anyhow.workspace = true
tokio.workspace = true
iroh = { workspace = true, optional = true, default-features = false, features = [
  "tls-ring"
] }
iroh-mdns-address-lookup = { workspace = true, optional = true }
n0-future = { workspace = true, optional = true }
nusb = { workspace = true, optional = true }

# BlueZ is Linux only
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true, optional = true }
