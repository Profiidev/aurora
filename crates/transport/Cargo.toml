[package]
name = "aurora_transport"
description = "iroh endpoint for Aurora, with USB (and later Bluetooth) links as extra iroh paths"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
iroh = [
  "dep:iroh",
  "dep:iroh-base",
  "dep:iroh-mdns-address-lookup",
  "dep:n0-future",
  "dep:n0-watcher",
  "dep:noq-udp",
  "dep:bytes"
]
# USB host side (desktop): switches phones into Android Open Accessory mode
nusb = ["iroh", "dep:nusb"]

[dependencies]
tracing.workspace = true
aurora_proto.workspace = true
anyhow.workspace = true
tokio.workspace = true
iroh = { workspace = true, optional = true, features = [
  "tls-ring",
  "unstable-custom-transports"
] }
iroh-base = { workspace = true, optional = true }
iroh-mdns-address-lookup = { workspace = true, optional = true }
n0-future = { workspace = true, optional = true }
n0-watcher = { workspace = true, optional = true }
noq-udp = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
nusb = { workspace = true, optional = true }

[dev-dependencies]
iroh = { workspace = true, features = ["tls-ring", "unstable-custom-transports"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
