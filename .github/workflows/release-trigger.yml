name: Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v0.0.0'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Update version
        id: update_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW_TAG=$INPUT_VERSION
          NEW_VERSION="${RAW_TAG#v}"
          echo "Bumping version to $NEW_VERSION"
          # Android reads its versionName/versionCode from Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo metadata -q > /dev/null
          IFS=. read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
          sed -i "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$NEW_VERSION\"/" platform/ios/project.yml
          sed -i "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$((MAJOR * 10000 + MINOR * 100 + PATCH))\"/" platform/ios/project.yml

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'Updated version to ${{ github.event.inputs.version }}'
          branch: chore/release-version-${{ github.event.inputs.version }}
          title: 'Release version ${{ github.event.inputs.version }}'
          body: 'This PR releases the version ${{ github.event.inputs.version }}.'
          base: main
          sign-commits: true
          labels: release-version
