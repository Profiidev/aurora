name: 'Android Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-android:
    permissions:
      contents: write
      id-token: write
    # Play upload only runs on releases; PR and push builds stay outside the environment
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk,just

      # PR build check: no fat LTO and no optimization, it only proves the app builds
      - name: Fast build settings
        if: github.event_name == 'pull_request'
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=0" >> "$GITHUB_ENV"

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_android_cache'

      - name: Cache gradle files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: app_release_gradle_cache
          restore-keys: app_release_gradle_cache
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/android/.gradle

      - name: setup Android signing
        if: github.event_name != 'pull_request'
        run: |
          cd platform/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # the runner image ships an NDK at ANDROID_NDK_LATEST_HOME
      - name: Build app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: just android-release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          name="${GITHUB_REPOSITORY#*/}_${{ github.event.release.tag_name || 'pr' }}"
          cp platform/android/app/build/outputs/apk/release/*.apk "dist/$name.apk"
          cp platform/android/app/build/outputs/bundle/release/*.aab "dist/$name.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: android
          path: dist/

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - id: auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/656946950800/locations/global/workloadIdentityPools/github/providers/aurora
          service_account: play-console-publisher@aurora-514718.iam.gserviceaccount.com

      - name: Upload Android app to Play Store
        if: github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          releaseFiles: 'dist/*.aab'
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: 'io.profidev.aurora'
          tracks: alpha
