name: 'Android Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk,just

      # PR build check: no fat LTO and no optimization, it only proves the app builds
      - name: Fast build settings
        if: github.event_name == 'pull_request'
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=0" >> "$GITHUB_ENV"

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_android_cache'

      - name: Cache gradle files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: app_release_gradle_cache
          restore-keys: app_release_gradle_cache
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            platform/android/.gradle

      - name: setup Android signing
        if: github.event_name != 'pull_request'
        run: |
          cd platform/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # the runner image ships an NDK at ANDROID_NDK_LATEST_HOME
      - name: Build app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: just android-release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          name="${GITHUB_REPOSITORY#*/}_${{ github.event.release.tag_name || 'pr' }}"
          cp platform/android/app/build/outputs/apk/release/*.apk "dist/$name.apk"
          cp platform/android/app/build/outputs/bundle/release/*.aab "dist/$name.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: android
          path: dist/

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
