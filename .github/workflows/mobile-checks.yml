name: Mobile Checks
on:
  pull_request:

jobs:
  android:
    name: Android clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk

      - name: Cache cargo and rust files
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'mobile_android_check_cache'

      # the runner image ships an NDK at ANDROID_NDK_LATEST_HOME
      - name: Clippy
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk -t arm64-v8a -P 31 clippy -p aurora_mobile --lib -- -D warnings

  ios:
    name: iOS clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-ios-sim

      - name: Cache cargo and rust files
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'mobile_ios_check_cache'

      - name: Clippy
        run: cargo clippy -p aurora_mobile --lib --target aarch64-apple-ios-sim -- -D warnings
