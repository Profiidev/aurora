name: 'Desktop Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-desktop:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: refresh apt index
        run: sudo apt-get update

      - name: install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          # gpui build deps, bluer (D-Bus) and libfuse2 for linuxdeploy (AppImage)
          packages: pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libdbus-1-dev libfuse2
          version: 1.4

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-packager@0.11.8

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache'

      # aurora-gui, aurorad and aurora ship together in each package
      - name: Build app
        run: cargo packager --release -f deb,appimage

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd "$OUT_DIR"
          gh release upload "$TAG" *.deb *.AppImage --clobber
