name: 'Desktop Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-desktop:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    env:
      OUT_DIR: target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: refresh apt index
        run: sudo apt-get update

      - name: install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          # gpui build deps, bluer (D-Bus) and libfuse2 for linuxdeploy (AppImage)
          packages: pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libdbus-1-dev libfuse2
          version: 1.4

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-packager@0.11.8

      # PR build check: no fat LTO and no optimization, it only proves the app builds
      - name: Fast build settings
        if: github.event_name == 'pull_request'
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=0" >> "$GITHUB_ENV"

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache'

      # aurora-gui, aurorad and aurora ship together in each package
      - name: Build app
        if: github.event_name == 'pull_request'
        run: cargo packager --release -f deb,appimage

      # signed with aurora's updater key, crates/ui/src/updater.rs holds the public half
      - name: Build and sign app
        if: github.event_name != 'pull_request'
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # empty when the key has no password, an empty value skips the password prompt
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo packager --release -f deb,appimage

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          cd "$OUT_DIR"
          appimage=$(ls *.AppImage)
          deb=$(ls *.deb)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # latest.json for cargo-packager-updater. It has no deb format and rejects unknown
          # ones, so the deb entry is tagged appimage; deb installs read `linux-x86_64-deb` and
          # install the verified bytes with `pkexec dpkg -i` (crates/ui/src/updater.rs)
          jq -n --arg version "${TAG#v}" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg appimage "$base/$appimage" --arg appimage_sig "$(cat "$appimage.sig")" \
            --arg deb "$base/$deb" --arg deb_sig "$(cat "$deb.sig")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "linux-x86_64": {url: $appimage, signature: $appimage_sig, format: "appimage"},
              "linux-x86_64-deb": {url: $deb, signature: $deb_sig, format: "appimage"}
            }}' > latest.json
          cat latest.json
          gh release upload "$TAG" "$appimage" "$deb" *.sig latest.json --clobber
