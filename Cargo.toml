[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/proto",
  "crates/transport",
  "crates/ui",
  "crates/viewer",
  "crates/daemon",
  "crates/cli",
  "crates/gui",
  "crates/mobile"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Profiidev/aurora"
license = "GPL-2.0"
keywords = ["phone", "desktop", "connect", "gpui"]
categories = []

[workspace.dependencies]
# Workspace crates
aurora_cli = { path = "crates/cli" }
aurora_core = { path = "crates/core" }
aurora_proto = { path = "crates/proto" }
aurora_transport = { path = "crates/transport" }
aurora_ui = { path = "crates/ui" }

# GPUI ecosystem
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
gpui-kit = { version = "0.8.1", default-features = false, features = [
  "component",
  "assets"
] }
# Plugin features: url_launcher, shared_preferences, path_provider, package_info,
# device_info, connectivity, network_info, vibration, battery, share, sensors,
# webview, file_selector, image_picker, camera, permission_handler,
# notifications, location, audio, video_player, clipboard, local_auth,
# in_app_review, contacts, maps_launcher, maps, calendar, deeplink, microphone,
# media_session. Enabling one also needs the matching AndroidManifest.xml block
# (platform/android) and Info.plist usage string (platform/ios).
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "7548ebc4b24f00494af9976af8852c7163ded9ce", default-features = false }
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"

# Networking and transports
# exact: the custom transport API (USB links) is unstable across minor releases
iroh = { version = "=1.4.1", default-features = false }
iroh-base = { version = "=1.4.1", default-features = false }
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
noq-udp = { version = "1.4.0", default-features = false }
nusb = { version = "0.2.9", features = ["tokio"] }
bytes = "1.11"

# Async and IPC
interprocess = { version = "2.4.8", features = ["tokio"] }
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros"
] }

# Config, files, misc
config = { version = "0.15.27", default-features = false, features = ["toml"] }
dirs = "6.0.0"
flume = "0.11"
notify = "8.2.2"
rustix = { version = "1", features = ["process"] }
qrcode = { version = "0.14.1", default-features = false }
serde_ignored = "0.1.14"
serde_json = "1.0"
tempfile = "3"
toml = "0.9"
url = "2"

# Serialization and crypto
blake3 = "1.8.7"
postcard = { version = "1.1.3", default-features = false, features = [
  "use-std"
] }
serde = { version = "1.0.229", features = ["derive"] }

# CLI, logging, and diagnostics
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.35"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[package]
name = "aurora"
description = "Aurora command line client"
readme = "README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# `cargo packager --release` (CI: .github/workflows/desktop-release.yml)
[package.metadata.packager]
product-name = "Aurora"
identifier = "io.profidev.aurora"
authors = ["ProfiiDev"]
publisher = "profidev"
category = "Utility"
before-packaging-command = "cargo build --release -p aurora -p aurora_daemon -p aurora_gui"
binaries = [
  { path = "aurora-gui", main = true },
  { path = "aurorad" },
  { path = "aurora" }
]
icons = [
  "platform/packaging/icons/32x32.png",
  "platform/packaging/icons/128x128.png",
  "platform/packaging/icons/128x128@2x.png",
  "platform/packaging/icons/icon.ico"
]

[package.metadata.packager.deb]
desktop-template = "platform/packaging/app.desktop"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libvulkan1",
  "libfontconfig1",
  "libfreetype6",
  "libxcb1"
]

[dependencies]
aurora_cli.workspace = true

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Full debuginfo makes the Android .so ~600 MB per ABI
debug = "line-tables-only"
